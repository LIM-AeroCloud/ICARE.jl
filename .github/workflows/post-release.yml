name: Post-Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  post-release:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.version.outputs.branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "Tagged version: $TAG"

          # Create post-release branch name
          BRANCH="post-rel/v$TAG"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Prepare branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.version.outputs.branch }}

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Run post-release script
        env:
          RELEASED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd release-scripts
          julia post-release.jl

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage Project.toml with new version
          git add Project.toml

          # Remove pre-release marker file if it exists (post-release script deletes it)
          MARKER_FILE=".pre-release-complete-v${{ steps.version.outputs.version }}"
          if [ ! -f "$MARKER_FILE" ]; then
            echo "Marker file was removed by post-release script"
            git add "$MARKER_FILE" 2>/dev/null || true
          fi

          # Extract new version from Project.toml
          NEW_VERSION=$(grep '^version = ' Project.toml | cut -d'"' -f2)
          git commit -m "Bump version to $NEW_VERSION"
          git push origin ${{ steps.version.outputs.branch }}

  create-pr:
    needs: post-release
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Fail if CI doesn't complete within 30 minutes

    steps:
      - name: Wait for CI to complete
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ needs.post-release.outputs.branch }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          running-workflow-name: 'create-pr'  # Exclude this workflow from waiting

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          BRANCH="post-rel/v$TAG"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Create Pull Request to dev
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.version.outputs.branch }}
          base: dev
          title: "Post-release v${{ steps.version.outputs.version }} - Bump to next DEV version"
          body: |
            ## Post-release v${{ steps.version.outputs.version }}

            This PR completes the release process by merging the next development version into `dev`.

            ✅ Release v${{ steps.version.outputs.version }} has been published
            ✅ Version bumped to next minor DEV version
            ✅ CI has passed on the post-release branch

            **Action required:** Please review and approve this PR to complete the automated release process.

            Once approved and merged, the release process is complete and development can continue on dev.
          labels: release,automated
          draft: false
