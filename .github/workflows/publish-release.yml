name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - 'Project.toml'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need at least 2 commits to compare

      - name: Check if version changed and is not DEV
        id: check
        run: |
          # Extract current version from Project.toml
          CURRENT_VERSION=$(grep '^version = ' Project.toml | cut -d'"' -f2)
          echo "Current version: $CURRENT_VERSION"

          # Check if this is a DEV version
          if [[ "$CURRENT_VERSION" == *"-DEV"* ]]; then
            echo "Version contains -DEV, skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get previous version from parent commit
          git checkout HEAD~1 -- Project.toml 2>/dev/null || true
          if [ -f Project.toml ]; then
            PREVIOUS_VERSION=$(grep '^version = ' Project.toml | cut -d'"' -f2)
            git checkout HEAD -- Project.toml
            echo "Previous version: $PREVIOUS_VERSION"

            if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
              echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            else
              echo "Version unchanged"
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No previous version found, treating as new release"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

  create-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read changelog
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: v${{ needs.check-version.outputs.version }}
          path: ./CHANGELOG.md

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.check-version.outputs.version }}" -m "v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: ${{ steps.changelog.outputs.changes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
