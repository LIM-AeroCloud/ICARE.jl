name: Merge Release to Dev

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - 'rel/**'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH=${{ github.event.workflow_run.head_branch }}
          VERSION=${BRANCH#rel/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create Pull Request to main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.version.outputs.branch }}
          base: main
          title: "Release ${{ steps.version.outputs.version }}"
          body: |
            ## Release ${{ steps.version.outputs.version }}

            This PR merges the release branch `${{ steps.version.outputs.branch }}` into `main`.

            ✅ CI has passed on the release branch
            ✅ Pre-release script has updated version and documentation

            **Action required:** Please review and approve this PR to continue the automated release process.

            Once approved and merged:
            - A git tag `v${{ steps.version.outputs.version }}` will be created on main
            - A GitHub release will be published
            - Post-release automation will create a PR to dev with the next DEV version
          labels: release,automated
          draft: false

      - name: Comment on success
        if: success()
        run: |
          echo "✅ Successfully merged ${{ steps.version.outputs.branch }} to dev"
          echo "Version ${{ steps.version.outputs.version }} is now ready for release"
